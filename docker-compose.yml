services:
  spa2mqtt:
    build: .
    container_name: spa2mqtt
    restart: unless-stopped
    volumes:
      - ./config.yml:/app/config.yml:ro
    environment:
      # Optional overrides; config.yml is preferred.
      - SPA_IP=${SPA_IP:-}
      - SPA_PORT=${SPA_PORT:-}
      - SPA_TRANSMIT=${SPA_TRANSMIT:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
