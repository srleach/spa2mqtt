[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "spa2mqtt"
version = "2.0.0"
description = "Bridge Balboa-family (Jacuzzi/Sundance encrypted) hot-tub RS485 buses to MQTT / Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "PyYAML>=6.0",
  "paho-mqtt>=2.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
serial = ["pyserial-asyncio>=0.6"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
spa2mqtt = "spa2mqtt.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["spa2mqtt"]

[tool.hatch.build.targets.wheel.force-include]
"definitions" = "spa2mqtt/definitions/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["esphome"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["PLR0917", "PLW2901", "B905", "RUF007", "PLR2004", "PLR0912", "PLR0913", "PLR0915", "PLR0911", "RUF001", "RUF002", "RUF003", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["spa2mqtt"]

[[tool.mypy.overrides]]
module = ["paho.*"]
ignore_missing_imports = true
