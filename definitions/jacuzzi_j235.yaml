# Jacuzzi J235 ("encrypted" / Sundance-style board).
#
# The status payload is decrypted once (status.decode: decrypt): the per-frame key payload[0]
# and a fixed key stream are removed, and every field then reads plaintext (docs/protocol.md §3.3). Every
# field cites the protocol document and carries the status assigned there. Entity keys and names
# are the identities Home Assistant uses today: changing a `key` changes the HA unique_id;
# changing a `name` changes the legacy discovery topic. See docs/design.md §8 before editing.
schema_version: 1
id: jacuzzi_j235
aliases: [jacuzzi_j235_encrypted]
name: Jacuzzi J235
manufacturer: Jacuzzi
model: J235
description: J-200 series, 2018 board, encrypted C4 status, read via EW11A or ESP32 UART.
protocol: balboa_encrypted
temperature_unit: C

# Home Assistant device identity. The identifier is the device the v1 bridge created; the
# device name defaults to `name` above. Both feed the legacy discovery topics (design.md §8).
ha:
  device_identifier: "185569045"

bus:
  baud: 115200
  client_mid: 0xBF
  channel_request_magic: [0xF1, 0x73]
  dormant_channel_threshold: 5

status:
  type: 0xC4
  decode: decrypt
  length: 33
  # S[i] = 0x19 ^ ((31 - i + adjust[i]) mod 64). The base is pyjacuzzi's decrypt(); the four
  # adjustments were calibrated against wall clock and topside readings (protocol.md §3.3).
  keystream: {xor: 0x19, start: 31, adjust: {"5": -8, "14": -8, "15": -8, "22": -8}}
  # Unkeyed J235 payload from 16 May 2025 (D1). Only used to rebuild frames from legacy
  # fold-only logs (the decoded CSV fixtures).
  fold_template: "000c04050a0e77f30b0f400f321390145a17140c1a1b3b19af1f1c504363202126"

commands:
  type: 0xCC
  encode: cc_xor
  buttons:
    temp_up: 0x01
    temp_down: 0x02
    pump_1: 0x04
    pump_2: 0x05
    light: 0x12

fields:
  # byte = plaintext payload index (1..32), see protocol.md §3.3.
  hour:
    {byte: 1, status: confirmed, evidence: "protocol.md §3.3; wall clock D3-D6; pyjacuzzi labelled frame"}
  minute:
    {byte: 22, status: confirmed, evidence: "protocol.md §3.3; wall clock D3-D6; pyjacuzzi labelled frame"}
  day_of_week:
    {byte: 5, mask: 0x07, status: confirmed, description: "0 = Sunday", evidence: "protocol.md §3.3; five dated J235 captures, three foreign frames"}
  day_of_month:
    {byte: 14, shift: 3, status: confirmed, evidence: "protocol.md §3.3; D1 16 May, D7 4 Nov, foreign frames"}
  month:
    {byte: 15, mask: 0x0F, status: confirmed, evidence: "protocol.md §3.3; D1 May, D7 November, foreign frames"}
  year:
    {byte: 19, offset: 2000, status: confirmed, evidence: "protocol.md §3.3; 2025, 2026 (J235), 2022, 2023 (foreign)"}
  water_temperature:
    {byte: 10, scale: 0.5, status: confirmed, evidence: "protocol.md §3.3, §5 d5; D7 display 38.5"}
  setpoint:
    {byte: 16, scale: 0.5, status: confirmed, evidence: "protocol.md §3.3, §5 d8; D7 38.5 -> 40.0 -> 38.5"}
  heater:
    {byte: 21, bit: 6, status: confirmed, evidence: "protocol.md §3.3, §5 d10; D7 t~512.8, D2 rows 1-51"}
  pump_1_running:
    {byte: 2, bit: 6, status: confirmed, description: "Pump 1 at any speed (J235 circulates on pump 1 low)", evidence: "protocol.md §3.3, §5 d1; D7 t~90-144"}
  pump_1_high:
    {byte: 5, bit: 4, status: confirmed, evidence: "protocol.md §3.3, §5 d2; D7 t~119"}
  pump_1_speed:
    {byte: 5, shift: 3, mask: 0x03, map: {"0": "off", "1": "low", "2": "high"}, status: confirmed, evidence: "protocol.md §3.3, §5 d2; D7 t~90/119/143"}
  pump_2:
    {byte: 3, bit: 2, status: confirmed, evidence: "protocol.md §3.3, §5 d1; D7 t~181/196"}
  manual_circulation:
    {byte: 2, bit: 7, status: hypothesis, evidence: "protocol.md §5 d1 (SpaControl MANUAL_CIRC); never observed set; byte assumed"}
  heat_demand:
    {byte: 2, bit: 5, status: hypothesis, description: "Set between pump 1 low start and heater on", evidence: "protocol.md §5 d1; D7 t~496"}
  set_mode:
    {byte: 5, bit: 5, status: confirmed, description: "Topside temperature-set mode active", evidence: "protocol.md §3.3, §7a; D7"}
  display_state:
    {byte: 26, status: confirmed, description: "0 normal screen, 1 temperature-set screen", evidence: "protocol.md §3.3; D7"}
  display_aux:
    {byte: 27, status: hypothesis, description: "Display or alert code: 0x4D in May 2025, 0x99 in Nov 2026 (the old fold 'display state')", evidence: "protocol.md §3.3"}
  secondary_value_raw:
    {byte: 28, status: hypothesis, description: "Unknown counter (the pump-1 flag is a separate byte now)", evidence: "protocol.md §3.3, §5 d14"}

entities:
  # --- sensors (legacy set; names define the legacy discovery topics) ---
  - key: current_temperature
    component: sensor
    field: water_temperature
    name: Current Water Temperature
    icon: mdi:coolant-temperature
    device_class: temperature
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 1
  - key: setpoint_temperature
    component: sensor
    field: setpoint
    name: Target Water Temperature
    icon: mdi:target
    device_class: temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
  - key: circulation_pump_status
    component: binary_sensor
    field: pump_1_running
    name: Circulation Pump Status
    description: Pump 1 running at any speed (the J235 circulates on pump 1 low).
    icon: mdi:water-pump
    device_class: running
    entity_category: diagnostic
  - key: secondary_pump_status
    component: binary_sensor
    field: pump_2
    name: Secondary Pump Status
    icon: mdi:water-pump
    device_class: running
    entity_category: diagnostic
  - key: main_pump_status
    component: binary_sensor
    field: pump_1_high
    name: Main Pump Status
    description: Pump 1 on high speed (jets).
    icon: mdi:water-pump
    device_class: running
    entity_category: diagnostic
  - key: manual_circulation_call
    component: binary_sensor
    field: manual_circulation
    name: Manual Circulation Call
    icon: mdi:water-pump
    device_class: running
  - key: heater_active
    component: binary_sensor
    field: heater
    name: Heater Active
    icon: mdi:radiator
    device_class: heat

  # --- controls (transmit must be enabled for these to be available) ---
  - key: temperature_increment
    component: button
    press: temp_up
    name: Temperature Increment
  - key: temperature_decrement
    component: button
    press: temp_down
    name: Temperature Decrement
  - key: pump_1_button
    component: button
    press: pump_1
    name: Pump 1 Button
  - key: pump_2_button
    component: button
    press: pump_2
    name: Pump 2 Button
  - key: light_button
    component: button
    press: light
    name: Light Button
    icon: mdi:lightbulb
  - key: temperature_set_control
    component: number
    field: setpoint
    name: Temperature Set Control
    control: {type: stepper, up: temp_up, down: temp_down, set_mode_field: set_mode, confirm_frames: 3, max_attempts: 60}
    min: 20
    max: 40
    step: 0.5
    mode: slider

  # --- new entities (not in the legacy set) ---
  # Pump 1 cycles off -> low -> high -> off, so "off" from low takes two presses; the speed
  # shows each step. The board runs pump 1 low by itself while it heats or filters: it then
  # stays on, and the switch gives up after max_presses.
  - key: pump_1_switch
    component: switch
    field: pump_1_running
    press: pump_1
    progress_field: pump_1_speed
    name: Pump 1
    icon: mdi:pump
  - key: pump_2_switch
    component: switch
    field: pump_2
    press: pump_2
    name: Pump 2
    icon: mdi:pump
  - key: pump_1_speed
    component: text_sensor
    field: pump_1_speed
    name: Pump 1 Speed
    icon: mdi:pump
  - key: set_mode_active
    component: binary_sensor
    field: set_mode
    name: Set Mode Active
    icon: mdi:gesture-tap-button
    entity_category: diagnostic
    enabled_by_default: false
  - key: display_state
    component: sensor
    field: display_state
    name: Display State
    icon: mdi:monitor
    entity_category: diagnostic
    enabled_by_default: false
  - key: secondary_value_raw
    component: sensor
    field: secondary_value_raw
    name: Secondary Value Raw
    icon: mdi:thermometer-lines
    entity_category: diagnostic
    enabled_by_default: false
