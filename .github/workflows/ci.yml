name: CI

# Runs on every pull request. release.yml also calls it (workflow_call) on every push to
# main, so a release is only tagged when this workflow passes on the exact commit.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # Pinned so a new ESPHome release cannot break CI without a code change.
  # Dependabot proposes updates (see .github/dependabot.yml).
  ESPHOME_VERSION: "2026.10.2"

jobs:
  python:
    name: Python ${{ matrix.python }} (lint, types, tests incl. C++ core)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m spa2mqtt validate
      - run: python tools/gen_esphome_package.py --check
      - run: pytest -q

  esphome:
    name: ESPHome component (config + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # Cache only downloaded toolchains and frameworks, keyed on the ESPHome version.
      # Never cache the project build directory (esphome/tests/.esphome): its CMake cache
      # stores absolute tool paths, which break when the runner image changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: esphome-toolchain-${{ runner.os }}-${{ env.ESPHOME_VERSION }}
      - run: pip install "esphome==${ESPHOME_VERSION}" jsonschema
      - run: esphome config esphome/tests/ci-local.yaml
      - run: esphome compile esphome/tests/ci-local.yaml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t spa2mqtt:ci .
      - run: docker run --rm spa2mqtt:ci spa2mqtt validate
