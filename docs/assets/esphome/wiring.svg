<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="s2m-wiring-title s2m-wiring-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="currentColor">
  <title id="s2m-wiring-title">ESP32 to spa RS485 wiring</title>
  <desc id="s2m-wiring-desc">The spa control board RS485 header has four connections: plus 12 volts, 0 volts, A and B. Connect A to A, B to B and 0 volts to the transceiver ground. Do not connect plus 12 volts unless you know the header's current rating. The RS485 transceiver connects to the ESP32: transceiver RO to GPIO18 (RX), GPIO17 (TX) to transceiver DI, and an optional flow control GPIO to DE and RE if the transceiver needs it. The ESP32 board takes power from its own DC supply.</desc>
  <defs>
    <marker id="s2m-wiring-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Boxes -->
  <g stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.06">
    <rect x="10" y="60" width="220" height="300" rx="10"/>
    <rect x="400" y="100" width="240" height="260" rx="10"/>
    <rect x="770" y="100" width="220" height="260" rx="10"/>
    <rect x="770" y="400" width="220" height="60" rx="10"/>
  </g>

  <!-- Box titles -->
  <g text-anchor="middle" stroke="none">
    <text x="120" y="30" font-weight="700">Spa (mains: isolate first)</text>
    <text x="120" y="88" font-weight="700">Control board</text>
    <text x="120" y="108" font-size="13">RS485 header for a</text>
    <text x="120" y="124" font-size="13">second topside panel</text>
    <text x="520" y="128" font-weight="700">RS485 transceiver</text>
    <text x="520" y="146" font-size="13">onboard (Waveshare) or</text>
    <text x="520" y="162" font-size="13">MAX3485 / SP3485 module</text>
    <text x="880" y="128" font-weight="700">ESP32</text>
    <text x="880" y="146" font-size="13">UART 115200 8N1</text>
    <text x="880" y="426" font-weight="700">Own DC supply</text>
    <text x="880" y="446" font-size="13">check the board's input range</text>
  </g>

  <!-- Pin labels: control board header -->
  <g font-size="14" text-anchor="end" stroke="none">
    <text x="220" y="175">+12 V</text>
    <text x="220" y="225">0 V</text>
    <text x="220" y="275">A</text>
    <text x="220" y="325">B</text>
  </g>
  <!-- Pin labels: transceiver bus side -->
  <g font-size="14" text-anchor="start" stroke="none">
    <text x="410" y="225">GND</text>
    <text x="410" y="275">A (+)</text>
    <text x="410" y="325">B (-)</text>
  </g>
  <!-- Pin labels: transceiver logic side -->
  <g font-size="14" text-anchor="end" stroke="none">
    <text x="630" y="205">RO</text>
    <text x="630" y="255">DI</text>
    <text x="630" y="305">DE / RE</text>
  </g>
  <!-- Pin labels: ESP32 -->
  <g font-size="14" text-anchor="start" stroke="none">
    <text x="780" y="205">GPIO18 (RX)</text>
    <text x="780" y="255">GPIO17 (TX)</text>
    <text x="780" y="305">flow_control_pin</text>
  </g>

  <!-- Pin dots -->
  <g stroke="none">
    <circle cx="230" cy="170" r="4"/>
    <circle cx="230" cy="220" r="4"/>
    <circle cx="230" cy="270" r="4"/>
    <circle cx="230" cy="320" r="4"/>
    <circle cx="400" cy="220" r="4"/>
    <circle cx="400" cy="270" r="4"/>
    <circle cx="400" cy="320" r="4"/>
    <circle cx="640" cy="200" r="4"/>
    <circle cx="640" cy="250" r="4"/>
    <circle cx="640" cy="300" r="4"/>
    <circle cx="770" cy="200" r="4"/>
    <circle cx="770" cy="250" r="4"/>
    <circle cx="770" cy="300" r="4"/>
  </g>

  <!-- Bus wires -->
  <g fill="none" stroke="currentColor" stroke-width="2.5">
    <line x1="230" y1="270" x2="400" y2="270"/>
    <line x1="230" y1="320" x2="400" y2="320"/>
    <line x1="230" y1="220" x2="400" y2="220" stroke-width="2"/>
  </g>
  <g font-size="13" text-anchor="middle" stroke="none">
    <text x="315" y="262">A to A</text>
    <text x="315" y="312">B to B</text>
    <text x="315" y="212">common ground</text>
    <text x="315" y="350">twisted pair</text>
  </g>

  <!-- +12 V: not connected -->
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5">
    <line x1="230" y1="170" x2="303" y2="170"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="2.5">
    <line x1="305" y1="160" x2="325" y2="180"/>
    <line x1="325" y1="160" x2="305" y2="180"/>
  </g>
  <g font-size="13" text-anchor="middle" stroke="none">
    <text x="315" y="150">not connected</text>
  </g>

  <!-- Logic wires -->
  <g fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#s2m-wiring-arrow)">
    <line x1="640" y1="200" x2="766" y2="200"/>
    <line x1="770" y1="250" x2="644" y2="250"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#s2m-wiring-arrow)">
    <line x1="770" y1="300" x2="644" y2="300"/>
  </g>
  <g font-size="13" text-anchor="middle" stroke="none">
    <text x="705" y="192">receive</text>
    <text x="705" y="242">transmit</text>
    <text x="705" y="292">optional</text>
  </g>

  <!-- Power -->
  <g fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#s2m-wiring-arrow)">
    <line x1="880" y1="400" x2="880" y2="364"/>
  </g>

  <!-- Legend -->
  <g font-size="13" stroke="none">
    <text x="10" y="400">Solid line: connect.</text>
    <text x="10" y="420">Dashed line: only when needed.</text>
    <text x="10" y="440">Cross: do not connect unless you know the header's rating.</text>
    <text x="10" y="460">Use a transceiver with 3.3 V logic, the same as the ESP32.</text>
  </g>
</svg>
